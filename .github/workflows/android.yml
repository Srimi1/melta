name: Android CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Lint
        run: ./gradlew --stacktrace lintDebug

      - name: Build debug APK
        run: ./gradlew --stacktrace assembleDebug

      - name: Check the sprite pack is in the APK
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          count=$(unzip -l "$apk" | grep -cE 'assets/sprites/(shiny/)?[0-9]+\.png$')
          echo "Sprites in APK: $count"
          unzip -l "$apk" | grep -q 'assets/sprites/25.png$' || { echo "Pikachu is missing from the APK"; exit 1; }
          [ "$count" -ge 2000 ] || { echo "Expected at least 2000 sprites"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: melta-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
