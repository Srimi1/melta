name: Release

on:
  push:
    tags: [ "v*" ]
  # Can also be started from the Actions tab: it creates the tag and the release in one go.
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, for example v0.1.0"
        required: true
        default: "v0.1.0"

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: add MELTA_KEYSTORE_BASE64, MELTA_KEYSTORE_PASSWORD, MELTA_KEY_ALIAS and
      # MELTA_KEY_PASSWORD as repository secrets to sign with your own key.
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.MELTA_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/melta.jks"
          echo "MELTA_KEYSTORE_PATH=$RUNNER_TEMP/melta.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          MELTA_KEYSTORE_PASSWORD: ${{ secrets.MELTA_KEYSTORE_PASSWORD }}
          MELTA_KEY_ALIAS: ${{ secrets.MELTA_KEY_ALIAS }}
          MELTA_KEY_PASSWORD: ${{ secrets.MELTA_KEY_PASSWORD }}
        run: |
          ./gradlew --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "melta-${VERSION}.apk"

      - name: Check the sprite pack is in the APK
        run: |
          apk="melta-${VERSION}.apk"
          count=$(unzip -l "$apk" | grep -cE 'assets/sprites/(shiny/)?[0-9]+\.png$')
          echo "Sprites in APK: $count"
          unzip -l "$apk" | grep -q 'assets/sprites/25.png$' || { echo "Pikachu is missing from the APK"; exit 1; }
          [ "$count" -ge 2000 ] || { echo "Expected at least 2000 sprites"; exit 1; }

      - name: Write release notes
        run: |
          cat > release-notes.md <<NOTES
          ## Install on Android

          1. Download **melta-${VERSION}.apk** below (under Assets).
          2. Open it on your phone. If Android asks, allow your browser or file manager to install unknown apps.
          3. Open **Melta**, tap **Battery Bar** and switch on **Show battery bar**.
          4. Allow **Display over other apps** (and notifications on Android 13+).

          Works on Android 8.0 and newer. All 1025 Pokémon are built in, so no internet is needed except for the optional animated sprites.

          If the bar disappears after a while on Xiaomi, Oppo, Vivo or Samsung phones, set Melta's battery usage to **Unrestricted**.
          NOTES

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Melta ${{ env.VERSION }}
          files: melta-*.apk
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
